[project]
name = "lostyle"
version = "0.1.0"
description = "Copy styles between LibreOffice / OpenDocument files (Draw, Writer, Calc, Impress)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aleksey Yablokov", email = "alex_ya@mailbox.org" }]
dependencies = ["lxml>=5.0", "tomli>=1.1; python_version < '3.11'"]

[project.scripts]
lostyle = "lostyle.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "lxml-stubs>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lostyle"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
